{% extends "base.html" %}
{% block title %}Mes tâches — taskflow{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Mes tâches ouvertes</h1>
<table class="table"><thead><tr><th>Nom</th><th>Projet</th><th>Statut</th></tr></thead>
<tbody>
{% for task in tasks %}
  <tr><td>{{ task.name }}</td><td>{{ task.project }}</td><td>{{ task.status }}</td></tr>
{% empty %}
  <tr><td colspan="3" class="text-muted">Aucune tâche ouverte ne vous est affectée.</td></tr>
{% endfor %}
</tbody></table>
{% endblock %}
